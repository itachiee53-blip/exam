  openModal('สรุปผล', body, `
    ${res.wrongList.length ? `<button class="btn orange" id="btnReplayAllWrong"><i data-lucide="repeat"></i>ซ่อมทั้งหมด</button>` : ''}
    <button class="btn ghost" data-close>ปิด</button>
  `);

  $$('[data-pickcat]').forEach(el => {
    el.onclick = () => {
      playTone('tap');
      openRoundDetail(resultId, el.dataset.pickcat);
    };
  });

  if($('#btnReplayAllWrong')){
    $('#btnReplayAllWrong').onclick = () => {
      playTone('tap');
      closeModal();
      startExam({
        ids: res.wrongList.map(w => w.id),
        count: res.wrongList.length,
        minutes: 0,
        mode: 'practice',
        label: 'ซ่อมข้อผิด'
      });
    };
  }
}

function renderSetting(){
  const st=S.settings;
  const currentTrackKey = st.track === 'suppress' ? 'suppress' : 'admin';
  const currentTrack = POLICE_TRACKS[currentTrackKey];
  const curPos = st.heroPos || 'center';

  $('#view').innerHTML=`
  <div class="card">
    <div class="srow"><div class="ic" style="background:var(--blue-2);color:var(--blue)"><i data-lucide="user"></i></div>
      <div style="flex:1"><b>ชื่อผู้ใช้</b><small>หน้าแรก</small></div>
      <input class="inp" id="s_name" value="${esc(st.name)}" placeholder="ชื่อ" style="width:140px"></div>

    <div class="srow"><div class="ic" style="background:var(--navy);color:#fff"><i data-lucide="shield"></i></div>
      <div style="flex:1"><b>สายสอบ</b><small>${esc(currentTrack.ruleDesc)}</small></div>
      <button class="c-select" id="btnSettingTrack">
        <span>${esc(currentTrack.name)}</span>
        <i data-lucide="chevron-down"></i>
      </button>
    </div>

    <div class="srow"><div class="ic" style="background:var(--red-2);color:var(--red)"><i data-lucide="calendar"></i></div>
      <div style="flex:1"><b>วันสอบจริง</b><small>นับถอยหลัง</small></div>
      <button class="c-select" id="btnPickDate">
        <span>${st.examDate ? formatThaiDate(st.examDate) : 'กำหนดวัน'}</span>
        <i data-lucide="chevron-down"></i>
      </button>
    </div>

    <div class="srow"><div class="ic" style="background:var(--surface3)"><i data-lucide="moon"></i></div>
      <div style="flex:1"><b>โหมดมืด</b><small>ถนอมตา</small></div>
      <div class="sw ${st.dark?'on':''}" id="s_dark"><i></i></div></div>

    <div class="srow"><div class="ic" style="background:var(--green-2);color:var(--green)"><i data-lucide="target"></i></div>
      <div style="flex:1"><b>เป้าต่อวัน</b><small>จำนวนข้อ</small></div>
      <button class="c-select" id="btnGoal">
        <span>${st.goal} ข้อ</span>
        <i data-lucide="chevron-down"></i>
      </button>
    </div>

    <div class="srow"><div class="ic" style="background:var(--orange-2);color:var(--orange)"><i data-lucide="sparkles"></i></div>
      <div style="flex:1"><b>สีออร่า</b><small>เมื่อเกินเป้า</small></div>
      <button class="c-select" id="btnSettingAuraTheme">
        <span>${esc(AURA_THEMES[st.auraTheme||'gold'].name)}</span>
        <i data-lucide="chevron-down"></i>
      </button>
    </div>

    <div class="srow"><div class="ic" style="background:var(--cyan-2);color:var(--cyan)"><i data-lucide="shuffle"></i></div>
      <div style="flex:1"><b>สุ่มข้อ</b><small>สลับข้อ</small></div>
      <div class="sw ${st.shuffleQ?'on':''}" id="s_sq"><i></i></div></div>

    <div class="srow"><div class="ic" style="background:var(--violet-2);color:var(--violet)"><i data-lucide="list-restart"></i></div>
      <div style="flex:1"><b>สลับชอยส์</b><small>สลับ ก-ง</small></div>
      <div class="sw ${st.shuffleC?'on':''}" id="s_sc"><i></i></div></div>

    <div class="srow"><div class="ic" style="background:var(--red-2);color:var(--red)"><i data-lucide="volume-2"></i></div>
      <div style="flex:1"><b>เสียง</b><small>ตอบถูก/ผิด</small></div>
      <div class="sw ${st.sound?'on':''}" id="s_snd"><i></i></div></div>

    <div class="srow" style="flex-wrap:wrap"><div class="ic" style="background:var(--blue-2);color:var(--blue)"><i data-lucide="image"></i></div>
      <div style="flex:1"><b>ภาพพื้นหลัง</b><small>ปรับชัด & ตำแหน่ง</small></div>
      <div class="row" style="gap:6px">
        <button class="btn sm ghost" id="btnUploadHero"><i data-lucide="upload"></i>เปลี่ยน</button>
        ${st.heroBg ? '<button class="ib sm red" id="btnResetHero" title="ลบ"><i data-lucide="trash-2"></i></button>' : ''}
      </div>
      ${st.heroBg ? `
        <div style="width:100%;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between">
          <small style="color:var(--muted)">ตำแหน่งภาพ:</small>
          <div class="chips">
            <button class="chip sm ${curPos==='top'?'on':''}" data-hpos="top">บน</button>
            <button class="chip sm ${curPos==='center'?'on':''}" data-hpos="center">กลาง</button>
            <button class="chip sm ${curPos==='bottom'?'on':''}" data-hpos="bottom">ล่าง</button>
          </div>
        </div>` : ''}
    </div>
    <input type="file" id="heroFileInput" accept="image/*" hidden>
  </div>

  <div class="sec"><i data-lucide="folder-tree"></i>จัดการหมวด</div>
  <div class="card">
    <div id="catbox">${S.cats.map(c=>{
      const n=S.questions.filter(q=>q.cat===c).length, m=S.cards.filter(x=>x.cat===c).length;
      const [bg,fg]=tone(c);
      return `<div class="catrow">
        <div class="ic" style="background:${bg};color:${fg}"><i data-lucide="${cicon(c)}"></i></div>
        <div style="flex:1"><b style="font-size:14.5px">${esc(c)}</b>
          <div style="font-size:12px;color:var(--muted)">${n.toLocaleString()} ข้อ · ${m.toLocaleString()} บัตร</div></div>
        <button class="ib sm" data-seticon="${esc(c)}" title="เปลี่ยนสี/ไอคอน"><i data-lucide="palette"></i></button>
        <button class="ib sm" data-catdrop="${esc(c)}" title="ลบ"><i data-lucide="trash-2"></i></button></div>`;}).join('')}</div>
    <div class="row" style="gap:8px;margin-top:14px">
      <input class="inp" id="newcat" placeholder="ชื่อหมวด" style="flex:1">
      <button class="btn" id="addcat"><i data-lucide="plus"></i>เพิ่ม</button></div>
  </div>

  <div class="sec"><i data-lucide="database"></i>ฐานข้อมูล</div>
  <div class="card">
    <div class="grid g2">
      <button class="btn ghost" id="d_out"><i data-lucide="download"></i>ส่งออก</button>
      <button class="btn ghost" id="d_in"><i data-lucide="upload"></i>นำเข้า</button>
      <button class="btn red" id="d_clearall"><i data-lucide="trash-2"></i>ล้างทั้งหมด</button>
      <button class="btn red" id="d_reset"><i data-lucide="rotate-ccw"></i>ล้างสถิติ</button>
    </div>
    <input type="file" id="d_file" accept="application/json" hidden>
  </div>

  <div class="card" style="margin-top:14px;text-align:center;color:var(--muted);font-size:12.5px">
    <b style="color:var(--text)">Police Prep</b><br>ออฟไลน์ 100%
  </div>`;

  $$('[data-hpos]').forEach(b => {
    b.onclick = () => {
      playTone('tap');
      S.settings.heroPos = b.dataset.hpos;
      save();
      renderSetting();
      toast('ปรับแล้ว', 'ok');
    };
  });

  $('#s_name').oninput=e=>{S.settings.name=e.target.value;save();};
  $('#s_dark').onclick=()=>{playTone('tap');S.settings.dark=!S.settings.dark;save();theme();renderSetting();};

  $('#btnPickDate').onclick=()=>{
    openThaiDatePicker(st.examDate, (val)=>{
      S.settings.examDate = val;
      save();
      renderSetting();
      toast(val ? `วันสอบ: ${formatThaiDate(val)}` : 'ล้างแล้ว', 'ok');
    });
  };
  
  $('#btnSettingTrack').onclick=()=>{
    openPicker({
      title:'สายสอบ',
      options: [
        { val: 'admin', label: 'อำนวยการ' },
        { val: 'suppress', label: 'ปราบปราม' }
      ],
      value: currentTrackKey,
      onSelect: (val)=>{
        S.settings.track = val;
        CFG.track = val;
        save();
        renderSetting();
        toast(`เลือกสาย${POLICE_TRACKS[val].name}แล้ว`,'ok');
      }
    });
  };

  $('#btnGoal').onclick=()=>{
    openPicker({
      title:'เป้าต่อวัน',
      options: GOAL_OPTIONS.map(n=>({val:n, label:`${n} ข้อ / วัน`})),
      value:st.goal,
      onSelect:(v)=>{
        S.settings.goal = +v;
        save();
        renderSetting();
        toast('บันทึกแล้ว','ok');
      }
    });
  };

  $('#btnSettingAuraTheme').onclick = () => {
    openPicker({
      title: 'สีออร่า',
      options: Object.entries(AURA_THEMES).map(([k,v]) => ({ val: k, label: v.name })),
      value: S.settings.auraTheme || 'gold',
      onSelect: (v) => {
        S.settings.auraTheme = v;
        save();
        renderSetting();
        toast('เปลี่ยนแล้ว', 'ok');
      }
    });
  };

  $('#s_sq').onclick=()=>{playTone('tap');S.settings.shuffleQ=!S.settings.shuffleQ;save();renderSetting();toast('บันทึกแล้ว','ok');};
  $('#s_sc').onclick=()=>{playTone('tap');S.settings.shuffleC=!S.settings.shuffleC;save();renderSetting();toast('บันทึกแล้ว','ok');};
  $('#s_snd').onclick=()=>{
    S.settings.sound=!S.settings.sound;
    save();
    renderSetting();
    if(S.settings.sound) playTone('ok');
  };

  const heroInput = $('#heroFileInput');
  $('#btnUploadHero').onclick = () => { playTone('tap'); heroInput.click(); };

  heroInput.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    const optImg = await optimizeImage(file, 2048, 0.90);
    openImageEditor(optImg, (finalImg) => {
      S.settings.heroBg = finalImg;
      save();
      renderSetting();
      toast('เปลี่ยนแล้ว', 'ok');
    });
    e.target.value = '';
  };

  if($('#btnResetHero')){
    $('#btnResetHero').onclick = async () => {
      if(await ask('รีเซ็ตพื้นหลัง?', 'ใช้ค่าเริ่มต้น', 'รีเซ็ต')){
        S.settings.heroBg = '';
        save();
        renderSetting();
        toast('ลบแล้ว', 'ok');
      }
    };
  }

  $$('[data-seticon]').forEach(b=>b.onclick=()=>{ playTone('tap'); openIconPicker(b.dataset.seticon); });

  $('#addcat').onclick=()=>{
    playTone('tap');
    const v=$('#newcat').value.trim();
    if(!v)return toast('ใส่ชื่อหมวด','err');
    if(S.cats.includes(v))return toast('มีหมวดนี้แล้ว','err');
    S.cats.push(v);save();renderSetting();toast('เพิ่มแล้ว','ok');};
  $('#newcat').onkeydown=e=>{if(e.key==='Enter')$('#addcat').click();};
  $$('[data-catdrop]').forEach(b=>b.onclick=async()=>{
    const c=b.dataset.catdrop;
    if(S.cats.length<=1)return toast('ต้องมีอย่างน้อย 1 หมวด','err');
    const n=S.questions.filter(q=>q.cat===c).length+S.cards.filter(x=>x.cat===c).length;
    if(await ask('ลบหมวดนี้?',n?`ข้อมูล ${n} รายการจะย้ายไปหมวดอื่น`:'ลบหมวดนี้','ลบ')){
      const to=S.cats.find(x=>x!==c);
      S.questions.forEach(q=>{if(q.cat===c)q.cat=to;});
      S.cards.forEach(x=>{if(x.cat===c)x.cat=to;});
      S.cats=S.cats.filter(x=>x!==c);
      save();renderSetting();syncChrome();toast('ลบแล้ว','ok');}});

  $('#d_out').onclick=()=>{
    playTone('tap');
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`policeprep-backup-${dkey()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('ส่งออกแล้ว','ok');};
  $('#d_in').onclick=()=>{ playTone('tap'); $('#d_file').click(); };
  $('#d_file').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.questions))throw 0;
      S=Object.assign(fresh(),d);
      S.questions.forEach(q => { q.d = 'ง่าย'; });
      day(); save(); theme(); go('home'); toast('นำเข้าแล้ว','ok');
    }catch(x){toast('ไฟล์ไม่ถูกต้อง','err');}};
    rd.readAsText(f); e.target.value='';};
  $('#d_clearall').onclick=async()=>{
    if(await ask('ล้างข้อมูลทั้งหมด?','ข้อมูลทั้งหมดจะถูกรีเซ็ตเป็น 0','ล้างทั้งหมด')){
      S=fresh();
      await dbSet('state',S);
      day();theme();renderSetting();syncChrome();
      toast('ล้างหมดแล้ว','ok');
    }
  };
  $('#d_reset').onclick=async()=>{
    if(await ask('ล้างสถิติ?','ประวัติและเวลาสะสมจะถูกรีเซ็ต (ไม่ลบข้อสอบ)','ล้างสถิติ')){
      S.results = [];
      S.qstat = {};
      S.stats = { minutes: 0, days: {} };
      S.session = null;
      S.last = null;
      S.questions.forEach(q => { q.d = 'ง่าย'; });
      day();
      save();
      renderSetting();
      syncChrome();
      toast('ล้างสถิติแล้ว','ok');
    }
  };
  icons();
}

function theme(){
  document.documentElement.dataset.theme=S.settings.dark?'dark':'light';
  $('#btnTheme').innerHTML=`<i data-lucide="${S.settings.dark?'sun':'moon'}"></i>`;
  icons();
}
$('#btnTheme').onclick=()=>{playTone('tap');S.settings.dark=!S.settings.dark;save();theme();if(PAGE==='setting')renderSetting();};

$('#btnSearch').onclick=()=>{
  playTone('tap');
  openModal('ค้นหา',`<div class="search" style="box-shadow:none"><i data-lucide="search"></i>
      <input id="gs" placeholder="พิมพ์คำค้น"></div>
    <div id="gres" style="margin-top:14px"></div>`,'',{focus:'#gs'});
  const run=()=>{
    const t=$('#gs').value.trim().toLowerCase();
    if(!t){$('#gres').innerHTML=`<div class="empty" style="padding:24px"><i data-lucide="search"></i><div>พิมพ์อย่างน้อย 1 ตัวอักษร</div></div>`;icons();return;}
    const qs=S.questions.filter(q=>q.q.toLowerCase().includes(t)).slice(0,8);
    const cs=S.cards.filter(c=>c.f.toLowerCase().includes(t)||c.b.toLowerCase().includes(t)).slice(0,6);
    $('#gres').innerHTML=(qs.length||cs.length)?`
      ${qs.length?`<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">ข้อสอบ ${qs.length}</div>
        ${qs.map(q=>`<div class="qrow" style="margin-bottom:7px"><div class="body">
          <div class="qt">${q.q}</div><div class="meta"><span class="tag b">${esc(q.cat)}</span>
          <span class="tag g">✓ ${esc(q.c[q.a])}</span></div></div>
          <button class="ib sm" data-gq="${q.id}"><i data-lucide="pencil"></i></button></div>`).join('')}`:''}
      ${cs.length?`<div style="font-size:12.5px;color:var(--muted);margin:14px 0 8px">บัตรจำ ${cs.length}</div>
        ${cs.map(c=>`<div class="qrow" style="margin-bottom:7px"><div class="body">
          <div class="qt">${esc(c.f)}</div><div style="font-size:12.5px;color:var(--muted);margin-top:3px;white-space:pre-wrap">${esc(c.b)}</div></div></div>`).join('')}`:''}`
      :`<div class="empty" style="padding:24px"><i data-lucide="search-x"></i><div>ไม่พบ</div></div>`;
    $$('[data-gq]').forEach(b=>b.onclick=()=>{playTone('tap');const q=S.questions.find(x=>x.id===b.dataset.gq);closeModal();setTimeout(()=>qForm(q),120);});
    icons();
  };
  $('#gs').oninput=run; run();
};

setInterval(()=>{
  if(document.hidden)return;
  S.stats.minutes++; day().minutes++; save();
  if(PAGE==='home'&&!EX.live)renderHome();
},60000);
window.addEventListener('beforeunload',()=>{if(EX.live)persist();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&EX.live)persist();});
window.addEventListener('pointerdown', initAudio, { once: true });

(async function initApp(){
  try{
    await initDB();
    const stored = await dbGet('state');
    if(stored && Array.isArray(stored.questions)){
      S = stored;
      let updated = false;
      S.questions.forEach(q => {
        if(!q.d || q.d !== 'ง่าย'){
          q.d = 'ง่าย';
          updated = true;
        }
      });
      if(updated) save();
    }else{
      S = fresh();
      await dbSet('state', S);
    }
  }catch(e){
    console.warn('IndexedDB fallback', e);
  }

  day();
  theme();
  go('home');
  icons();
})();
</script>
</body>
</html>

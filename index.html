<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Police Prep · ติวสอบตำรวจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{
  --bg:#f2f5fa; --surface:#fff; --surface2:#f6f8fc; --surface3:#eef2f9;
  --text:#0e1b31; --text2:#41527a; --muted:#7286a6; --line:#e4eaf4;
  --navy:#0e2c58; --blue:#2b7cf0; --blue-2:#e9f1ff;
  --green:#12a150; --green-2:#e4f8ed;
  --orange:#f08c00; --orange-2:#fff2dd;
  --red:#e04347; --red-2:#fdeaeb;
  --violet:#7a5af8; --violet-2:#f0ecff;
  --cyan:#0097a7; --cyan-2:#e0f7fa;
  --primary:#0e2c58; --onp:#fff;
  --r:18px; --r2:14px; --r3:11px;
  --sh1:0 1px 3px rgba(14,44,88,.06),0 4px 14px rgba(14,44,88,.05);
  --sh2:0 8px 30px rgba(14,44,88,.11);
}
[data-theme="dark"]{
  --bg:#080e1a; --surface:#101a2c; --surface2:#152136; --surface3:#1c2b45;
  --text:#e9eff9; --text2:#b3c2da; --muted:#8397b8; --line:#20304a;
  --navy:#e9eff9; --blue:#5c9dff; --blue-2:#16263f;
  --green:#2fcb7c; --green-2:#0f2c1e;
  --orange:#fbb034; --orange-2:#2f2410;
  --red:#ff6b70; --red-2:#33171a;
  --violet:#9d8bff; --violet-2:#1e1a38;
  --cyan:#26c6da; --cyan-2:#09292d;
  --primary:#2b7cf0; --onp:#fff;
  --sh1:0 1px 3px rgba(0,0,0,.3); --sh2:0 10px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html, body{width:100%;max-width:100vw;min-height:100dvh;overflow-x:hidden}
body.modal-locked, body.lightbox-open{overflow:hidden!important;touch-action:none!important;position:fixed;width:100%;height:100%}

body{
  margin:0;font-family:'Sarabun',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.2px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px}
[hidden]{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.app{display:grid;grid-template-columns:265px 1fr;min-height:100dvh;width:100%}
.sidebar{
  position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:5px;z-index:20;overflow-y:auto
}
.brand{display:flex;align-items:center;gap:11px;padding:5px 9px 18px;flex:none}
.brand .logo{
  width:43px;height:43px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#0e2c58,#2b7cf0);box-shadow:0 6px 16px rgba(43,124,240,.32)
}
[data-theme="dark"] .brand .logo{background:linear-gradient(140deg,#2b7cf0,#7a5af8)}
.brand b{display:block;font-size:17px;line-height:1.15;letter-spacing:-.3px}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.2px}
.nav{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:13px;
  color:var(--muted);font-weight:500;text-align:left;transition:.18s;position:relative;flex:none
}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:var(--primary);color:var(--onp);box-shadow:0 6px 16px rgba(14,44,88,.22)}
.nav .pill{margin-left:auto;font-size:11px;font-weight:600;background:var(--surface3);color:var(--muted);padding:1px 8px;border-radius:20px}
.nav.on .pill{background:rgba(255,255,255,.22);color:#fff}
.sfoot{margin-top:auto;background:var(--surface2);border-radius:15px;padding:14px;font-size:12px;color:var(--muted);flex:none}
.sfoot .row{display:flex;justify-content:space-between;padding:3.5px 0}
.sfoot b{color:var(--text)}

.main{
  width:100%;max-width:1180px;padding:24px 30px calc(40px + env(safe-area-inset-bottom));
  min-width:0;contain:content;
}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;min-height:44px}
.topbar h1{font-size:22px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.tools{margin-left:auto;display:flex;gap:8px}

.bottomnav{
  display:none;position:fixed;inset:auto 0 0 0;z-index:70;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 2px calc(8px + env(safe-area-inset-bottom));
  justify-content:space-around;box-shadow:0 -4px 16px rgba(0,0,0,.04);backdrop-filter:blur(8px);
}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:6px 2px;border-radius:12px;flex:1;transition:.18s}
.bn svg{width:20px;height:20px}
.bn.on{color:var(--blue);background:var(--blue-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:18px;min-width:0}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border-radius:13px;
  font-weight:600;font-size:14.5px;background:var(--primary);color:var(--onp);transition:transform .12s,box-shadow .2s;white-space:nowrap
}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.orange{background:var(--orange)}
.btn.red{background:var(--red)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%} .btn.lg{padding:15px 22px;font-size:15.5px;border-radius:16px}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px} .btn.sm svg{width:15px;height:15px}

.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:.18s;flex:none}
.ib svg{width:18px;height:18px}
.ib:hover{color:var(--blue);border-color:var(--blue)}
.ib.sm{width:33px;height:33px;border-radius:10px} .ib.sm svg{width:15px;height:15px}
.ib.on{color:var(--orange);border-color:var(--orange);background:var(--orange-2)}
.ib.star.on{color:#f5a524;border-color:#f5a524;background:#fff6e0}
.ib.cut.on{color:var(--red);border-color:var(--red);background:var(--red-2)}

.chip{padding:7px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);transition:.18s;white-space:nowrap}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--primary);color:var(--onp);border-color:transparent;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.sc::-webkit-scrollbar{display:none}

.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--surface3);color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-weight:500}
.tag.b{background:var(--blue-2);color:var(--blue)} .tag.g{background:var(--green-2);color:var(--green)}
.tag.o{background:var(--orange-2);color:var(--orange)} .tag.r{background:var(--red-2);color:var(--red)}

.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);outline:none;transition:.18s}
.inp:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px var(--blue-2)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.6}

.c-select{
  display:inline-flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  font-size:13.5px;font-weight:500;cursor:pointer;transition:.18s
}
.c-select:hover{border-color:var(--blue);background:var(--surface)}
.c-select svg{width:15px;height:15px;color:var(--muted)}

.picker-item{
  display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;
  border-radius:14px;font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px;
  background:var(--surface2);border:1px solid var(--line);transition:.16s;text-align:left
}
.picker-item:hover{background:var(--blue-2);color:var(--blue);border-color:var(--blue)}
.picker-item.on{background:var(--blue-2);color:var(--blue);border-color:var(--blue);font-weight:600}
.picker-item .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.picker-item.on .chk{border-color:var(--blue);background:var(--blue);color:#fff}

.banner-slider{position:relative;margin-bottom:14px;overflow:hidden;border-radius:18px}
.banner-track{display:flex;transition:transform .4s ease;width:100%}
.banner-slide{flex:0 0 100%;min-width:100%}
.banner-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.b-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}
.b-dot.on{width:18px;border-radius:4px;background:var(--blue)}

.coach-box{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);min-height:72px}
.coach-box .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.coach-box b{display:block;font-size:14.5px;line-height:1.3}
.coach-box small{font-size:12px;color:var(--muted);margin-top:2px;display:block}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;box-shadow:var(--sh1)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;padding:11px 0;color:var(--text)}

.bar{height:7px;border-radius:8px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--blue);transition:width .7s}
.bar i.ok{background:var(--green)} .bar i.warn{background:var(--orange)}

.sec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:24px 0 12px}
.sec svg{width:17px;height:17px;color:var(--muted)}
.sec .more{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--blue);cursor:pointer}
.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.45;margin-bottom:8px}

#view{animation:in .34s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}

.qrow .qt, .rq {
  white-space: pre-wrap !important;
  word-break: break-word;
  line-height: 1.65;
}

.q-media-box {
  width: 100%;
  margin: 10px 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.q-media-img {
  width: var(--img-w, 240px);
  max-width: 100%;
  max-height: 480px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--surface2);
  cursor: pointer;
  object-fit: contain;
  box-shadow: var(--sh1);
  display: block;
  margin: 0 auto;
  transition: transform .18s;
}
.q-media-img:hover {
  transform: scale(1.02);
}

.opts-vertical {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opts-horizontal {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media(max-width:560px){
  .opts-horizontal { grid-template-columns: 1fr; }
}

.opts-boxed {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.opt-wrap {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
}

.opt-text {
  white-space: pre-wrap !important;
  word-break: break-word;
  line-height: 1.65;
  display: block;
}

.opt-boxed-text {
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  background: var(--surface);
  line-height: 1.65;
  white-space: pre-wrap !important;
  word-break: break-word;
  display: block;
  font-family: inherit;
  font-size: 14.5px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  width: 100%;
}
.opt.on .opt-boxed-text {
  border-color: var(--blue);
  background: #fff;
}
.opt.right .opt-boxed-text {
  border-color: var(--green);
  background: #fff;
}

.opt.is-cut {
  opacity: 0.38 !important;
  filter: grayscale(1);
  text-decoration: line-through;
  pointer-events: none !important;
  background: var(--surface3) !important;
  border-color: transparent !important;
}
.opt.is-cut * {
  text-decoration: line-through;
}

.opt-exp-box {
  display: none;
  margin-top: 8px;
  padding: 14px 16px !important;
  text-align: left !important;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.65;
  white-space: pre-wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--sh1);
  width: 100%;
  box-sizing: border-box;
  animation: pop .2s ease;
}
.opt-exp-box.open { display: block; }

.btn-why-round {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(14, 44, 88, 0.05);
  color: var(--muted);
  border: 1px solid rgba(14, 44, 88, 0.08);
  transition: all .2s cubic-bezier(.2,.8,.2,1);
  z-index: 5;
  backdrop-filter: blur(4px);
}
[data-theme="dark"] .btn-why-round {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.1);
  color: var(--muted);
}
.btn-why-round:hover {
  background: var(--blue-2);
  color: var(--blue);
  border-color: var(--blue);
  transform: scale(1.08);
}
.btn-why-round.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
  box-shadow: 0 2px 8px rgba(43,124,240,.35);
}
.btn-why-round svg {
  width: 15px;
  height: 15px;
}

@keyframes ringAuraGlow {
  0%, 100% { filter: drop-shadow(0 0 8px var(--ring-glow, rgba(78,240,163,0.65))); }
  50% { filter: drop-shadow(0 0 18px var(--ring-glow, rgba(78,240,163,0.95))); }
}

.hero{
  background:linear-gradient(135deg,#0e2c58,#17457f 55%,#2b7cf0);
  color:#fff;border-radius:22px;padding:24px;display:flex;gap:22px;align-items:center;
  box-shadow:var(--sh2);position:relative;overflow:hidden;
}
.hero h2{font-size:22px} .hero p{opacity:.92;font-size:13px;margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hero .cta{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.2);backdrop-filter:blur(4px);color:#fff}
.hero .btn.w{background:#fff;color:#0e2c58}

.ringbox{position:relative;width:138px;height:138px;flex:none;margin-left:auto}
.ringbox svg{width:138px;height:138px;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-linecap:round}
.ringbox .bgc{stroke:rgba(255,255,255,.22);stroke-width:10}
.ringbox .fgc{
  stroke-width:11;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke .5s;
}
.ringbox.has-aura svg {
  animation: ringAuraGlow 3s infinite ease-in-out;
}
.ringbox .txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox .txt b{font-size:25px;line-height:1} .ringbox .txt span{font-size:11px;opacity:.9}

.stat{display:flex;align-items:center;gap:12px}
.stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:21px;height:21px}
.stat b{display:block;font-size:22px;line-height:1.15} .stat span{font-size:12px;color:var(--muted)}

.quick{display:flex;flex-direction:column;align-items:center;gap:9px;padding:20px 10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);font-weight:600;transition:.2s}
.quick:hover{transform:translateY(-4px);border-color:var(--blue)}
.quick .ic{width:50px;height:50px;border-radius:17px;display:grid;place-items:center}
.quick .ic svg{width:23px;height:23px}
.quick small{font-weight:400;font-size:11.5px;color:var(--muted)}

.resume-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  box-shadow:var(--sh1);position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:165px
}
.resume-card .top{display:flex;align-items:flex-start;gap:13px}
.resume-card .top .ic{
  width:46px;height:46px;border-radius:15px;background:var(--blue-2);color:var(--blue);
  display:grid;place-items:center;flex:none
}
.week-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  box-shadow:var(--sh1);display:flex;flex-direction:column;justify-content:space-between;min-height:165px
}
.week-stage{display:flex;align-items:flex-end;gap:8px;height:95px;padding-top:15px}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week-col .num{font-size:10px;font-weight:700;color:var(--muted);min-height:14px}
.week-col .bx{
  width:100%;max-width:24px;border-radius:6px 6px 3px 3px;background:var(--surface3);
  min-height:6px;transition:height .7s cubic-bezier(.2,.8,.2,1),background .3s
}
.week-col .bx.act{background:linear-gradient(180deg,var(--blue),#1d4f92)}
.week-col .bx.today{background:linear-gradient(180deg,#3dd588,var(--green))}
.week-col .day{
  font-size:11.5px;font-weight:600;color:var(--muted);width:22px;height:22px;
  display:grid;place-items:center;border-radius:50%
}
.week-col.is-today .day{background:var(--green-2);color:var(--green);font-weight:700}
.week-col.is-today .num{color:var(--green)}

.setcard{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);display:flex;flex-direction:column;gap:11px;transition:.2s}
.setcard:hover{transform:translateY(-3px)}
.setcard .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.setcard .acts{display:flex;gap:7px}
.setcard .acts .btn{flex:1}

.qrow{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:15px;background:var(--surface);border:1px solid var(--line);margin-bottom:9px;box-shadow:var(--sh1);animation:pop .25s ease}
.qrow .no{width:27px;height:27px;border-radius:9px;background:var(--surface3);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);flex:none}
.qrow .body{flex:1;min-width:0}
.qrow .qt{font-size:14.5px;font-weight:500;line-height:1.6}
.qrow .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.qrow .side{display:flex;gap:6px;flex:none}
.qrow .ansline{font-size:12.5px;color:var(--green);margin-top:5px;font-weight:600}

.fab{
  position:fixed;right:24px;bottom:26px;z-index:65;padding:14px 20px;border-radius:30px;
  background:var(--primary);color:var(--onp);font-weight:600;display:flex;align-items:center;
  gap:8px;box-shadow:0 12px 28px rgba(14,44,88,.34);transition:.2s
}
.fab svg{width:18px;height:18px}

.fstage{max-width:640px;margin:0 auto}
.fcard{perspective:1500px;height:330px;margin:12px 0 16px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .62s}
.fcard.flip .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;box-shadow:var(--sh2)}
.front{background:linear-gradient(150deg,#0e2c58,#1d4f92);color:#fff}
[data-theme="dark"] .front{background:linear-gradient(150deg,#152c4f,#2b6bbf)}
.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg)}
.face .q{font-size:21px;font-weight:600;line-height:1.55}
.back .q{font-size:17.5px;font-weight:400;color:var(--text2)}
.fctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

.rtop{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.timer{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--sh1)}
.timer svg{width:16px;height:16px;color:var(--muted)}
.timer.warn{background:var(--red-2);color:var(--red);border-color:transparent;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.5}}
.rgrid{display:grid;grid-template-columns:1fr 236px;gap:16px;align-items:start}
.rq{font-size:19.5px;font-weight:600;line-height:1.65;margin:12px 0 16px}

.opt{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-start;
  width:100%;
  text-align:left;
  padding:14px 44px 14px 16px;
  border-radius:15px;
  background:var(--surface2);
  border:2px solid transparent;
  transition:.16s;
  font-size:15px;
}
.opt-header{display:flex;gap:13px;align-items:flex-start;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(2px)}
.opt .k{width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);flex:none}
.opt.on{background:var(--blue-2);border-color:var(--blue)} .opt.on .k{background:var(--blue);color:#fff;border-color:transparent}
.opt.right{background:var(--green-2);border-color:var(--green)} .opt.right .k{background:var(--green);color:#fff;border-color:transparent}
.opt.bad{background:var(--red-2);border-color:var(--red)} .opt.bad .k{background:var(--red);color:#fff;border-color:transparent}
.opt:disabled{cursor:default}
.fb{padding:14px 16px;border-radius:14px;font-size:13.5px;line-height:1.6;animation:pop .25s ease;margin-top:14px}
.fb.ok{background:var(--green-2);color:var(--green)} .fb.no{background:var(--red-2);color:var(--red)}
.palgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:290px;overflow:auto;padding:2px}
.pal{aspect-ratio:1;border-radius:10px;background:var(--surface3);color:var(--muted);font-size:12.5px;font-weight:600}
.pal.done{background:var(--blue);color:#fff}
.pal.cur{outline:2.5px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:11px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle}
.rnav{display:flex;gap:9px;margin-top:16px}
.rnav .btn{flex:1}

.pass-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-top:10px}
.pass-badge.pass{background:var(--green-2);color:var(--green)}
.pass-badge.fail{background:var(--red-2);color:var(--red)}

.sring{position:relative;width:196px;height:196px;margin:0 auto}
.sring svg{transform:rotate(-90deg);width:196px;height:196px}
.sring circle{fill:none;stroke-width:15;stroke-linecap:round}
.sring .bgc{stroke:var(--surface3)}
.sring .fgc{transition:stroke-dashoffset 1.1s}
.sring .txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.sring .txt b{font-size:40px;line-height:1} .sring .txt span{font-size:13px;color:var(--muted)}
.mini{text-align:center;padding:13px 8px;border-radius:14px;background:var(--surface2)}
.mini b{display:block;font-size:19px;line-height:1.3} .mini span{font-size:11.5px;color:var(--muted)}

.part-header{font-size:13px;font-weight:700;color:var(--navy);padding:8px 0 4px;border-bottom:1.5px solid var(--line);margin:10px 0 8px;display:flex;justify-content:space-between}
.part-header.p2{margin-top:14px}
.crow{display:grid;grid-template-columns:110px 1fr 58px;gap:10px;align-items:center;margin-bottom:8px;font-size:12.5px}
.crow .lb{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.crow .vl{text-align:right;font-weight:600}

.hrow{display:flex;align-items:center;gap:11px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px;transition:.16s}
.hrow:hover{background:var(--surface2)}
.hrow:last-child{border-bottom:0}

.srow{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.srow .ic svg{width:18px;height:18px}
.srow b{display:block;font-size:14px} .srow small{font-size:11.5px;color:var(--muted)}
.sw{width:48px;height:28px;border-radius:20px;background:var(--line);position:relative;transition:.24s;flex:none;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.24s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--green)} .sw.on i{left:23px}

.catrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;transition:.2s}
.catrow .ic svg{width:20px;height:20px}

.mask{
  position:fixed;inset:0;background:rgba(8,16,32,.78);z-index:120;display:none;
  align-items:center;justify-content:center;padding:16px;touch-action:none
}
.mask.on{display:flex}
.modal{
  background:var(--surface);border-radius:22px;width:100%;max-width:680px;
  max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.4);
  overflow:hidden;margin:auto
}
.mh{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line);flex:none}
.mh b{font-size:16px}
.mb{padding:18px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.mf{padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:9px;flex:none;border-top:1px solid var(--line)}
.mf .btn{flex:1}
.toasts{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;background:var(--navy);color:var(--bg);font-size:13.5px;font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.toast svg{width:17px;height:17px}
.toast.ok{background:var(--green);color:#fff} .toast.err{background:var(--red);color:#fff}

.img-editor-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;display:none;
  align-items:center;justify-content:center;padding:14px;touch-action:none
}
.img-editor-mask.on{display:flex}
.img-editor-modal{
  background:var(--surface);width:100%;max-width:580px;border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.5)
}
.img-editor-canvas-wrap{
  position:relative;width:100%;height:340px;background:#181c24;
  background-image:linear-gradient(45deg,#20242d 25%,transparent 25%),linear-gradient(-45deg,#20242d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#20242d 75%),linear-gradient(-45deg,transparent 75%,#20242d 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none
}
#imgEditorCanvas{max-width:100%;max-height:100%;display:block;box-shadow:0 5px 20px rgba(0,0,0,.4)}

.img-grid{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.img-thumb{
  width:84px;height:84px;border-radius:12px;object-fit:cover;cursor:pointer;
  border:1.5px solid var(--line);transition:transform .16s,box-shadow .16s;background:var(--surface2)
}
.img-thumb:hover{transform:scale(1.04);box-shadow:var(--sh1);border-color:var(--blue)}
.img-preview-box{display:flex;align-items:center;gap:8px;position:relative}
.img-preview-box .del-btn{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px
}

/* Minimalist Rich Text Editor Modal */
.rte-mask{
  position:fixed;inset:0;background:rgba(8,16,32,.85);z-index:160;display:none;
  align-items:center;justify-content:center;padding:14px;touch-action:none;backdrop-filter:blur(4px);
}
.rte-mask.on{display:flex}
.rte-modal{
  background:var(--surface);width:100%;max-width:680px;height:82dvh;border-radius:24px;
  display:flex;flex-direction:column;box-shadow:var(--sh2);overflow:hidden;border:1px solid var(--line);
}
.rte-toolbar{
  display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:10px 14px;background:var(--surface2);
  border-bottom:1px solid var(--line);align-items:center;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.rte-toolbar::-webkit-scrollbar{display:none}
.rte-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);color:var(--text);cursor:pointer;transition:.15s;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.rte-btn svg{width:17px;height:17px}
.rte-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-2)}
.rte-btn:active{transform:scale(.92)}
.rte-sep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
.rte-area{
  padding:20px;flex:1;overflow-y:auto;outline:none;font-size:17px;line-height:1.8;
  color:var(--text);white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch;
}
.rte-area:empty:before{content:attr(placeholder);color:var(--muted);pointer-events:none}

/* Minimal Color Palette */
.rte-color-palette{
  display:none;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);
  gap:8px;flex-wrap:wrap;align-items:center;animation:in .2s ease;
}
.rte-color-palette.open{display:flex}
.rte-dot{
  width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .15s, border-color .15s;
}
.rte-dot:hover{transform:scale(1.15)}
.rte-dot:active{transform:scale(.92)}

.lightbox-mask{
  position:fixed;inset:0;background:rgba(5,10,20,.95);z-index:999;display:none;
  align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(8px);
}
.lightbox-mask.on{display:flex}
.lightbox-container{
  position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.lightbox-img{max-width:94vw;max-height:86dvh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.7);object-fit:contain}
.lightbox-close{
  position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.2s;z-index:1002
}
.lightbox-close:hover{background:rgba(255,255,255,.35)}
.lb-btn{
  position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer;
  transition:.2s;z-index:1001;user-select:none;-webkit-user-select:none;
}
.lb-btn:hover{background:rgba(255,255,255,.4)}
.lb-btn:active{transform:translateY(-50%) scale(.92)}
.lb-btn svg{width:24px;height:24px}
.lb-prev{left:14px}
.lb-next{right:14px}
.lb-counter{
  position:absolute;top:calc(22px + env(safe-area-inset-top));left:20px;color:#fff;
  font-size:13.5px;font-weight:600;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:20px;
  letter-spacing:.3px;z-index:1002
}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .bottomnav{display:flex}
  .main{padding:14px 13px calc(86px + env(safe-area-inset-bottom))}
  .rgrid{grid-template-columns:1fr}
  .palette{display:none}
  .fab{bottom:calc(68px + env(safe-area-inset-bottom));right:16px}
  .hero{flex-direction:column;align-items:stretch}
  .ringbox{margin:4px auto 0}
}
@media(max-width:720px){
  .g3,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
  .fcard{height:290px}
  .modal{max-height:94dvh;border-radius:20px;width:96vw}
  .rte-modal{height:88dvh;border-radius:20px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><i data-lucide="shield-check"></i></div>
      <div><b>Police Prep</b><span>ติวสอบตำรวจ</span></div>
    </div>
    <button class="nav on" data-go="home"><i data-lucide="layout-dashboard"></i>หน้าแรก</button>
    <button class="nav" data-go="quiz"><i data-lucide="file-text"></i>ข้อสอบ<span class="pill" id="pillQ">0</span></button>
    <button class="nav" data-go="cards"><i data-lucide="layers"></i>บัตรจำ<span class="pill" id="pillC">0</span></button>
    <button class="nav" data-go="exam"><i data-lucide="timer"></i>จำลองสอบ</button>
    <button class="nav" data-go="result"><i data-lucide="bar-chart-3"></i>ผลลัพธ์</button>
    <button class="nav" data-go="setting"><i data-lucide="settings"></i>ตั้งค่า</button>
    <div class="sfoot" id="sfoot"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="ttl">หน้าแรก</h1>
        <div class="sub" id="sub">ติวสอบตำรวจ</div>
      </div>
      <div class="tools">
        <button class="ib" id="btnSearch" title="ค้นหา"><i data-lucide="search"></i></button>
        <button class="ib" id="btnTheme" title="ธีม"><i data-lucide="moon"></i></button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<nav class="bottomnav">
  <button class="bn on" data-go="home"><i data-lucide="home"></i>หน้าแรก</button>
  <button class="bn" data-go="quiz"><i data-lucide="file-text"></i>ข้อสอบ</button>
  <button class="bn" data-go="cards"><i data-lucide="layers"></i>บัตรจำ</button>
  <button class="bn" data-go="exam"><i data-lucide="timer"></i>สอบ</button>
  <button class="bn" data-go="result"><i data-lucide="bar-chart-3"></i>ผล</button>
  <button class="bn" data-go="setting"><i data-lucide="settings"></i>ตั้งค่า</button>
</nav>

<button class="fab" id="fab" hidden></button>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<div class="lightbox-mask" id="lightbox">
  <div class="lb-counter" id="lbCounter">1 / 1</div>
  <div class="lightbox-close" id="lightboxClose"><i data-lucide="x"></i></div>
  <button class="lb-btn lb-prev" id="lbPrev" title="รูปก่อนหน้า"><i data-lucide="chevron-left"></i></button>
  <div class="lightbox-container" id="lbTouchArea">
    <img class="lightbox-img" id="lightboxImg" src="" alt="Full Preview">
  </div>
  <button class="lb-btn lb-next" id="lbNext" title="รูปถัดไป"><i data-lucide="chevron-right"></i></button>
</div>

<div class="img-editor-mask" id="imgEditorMask">
  <div class="img-editor-modal">
    <div class="mh" style="justify-content:space-between">
      <div class="row" style="gap:8px">
        <i data-lucide="crop" style="width:18px;height:18px;color:var(--orange)"></i>
        <b>ปรับรูป</b>
      </div>
      <div class="row" style="gap:6px">
        <button class="ib sm" id="edRotL" title="หมุนซ้าย"><i data-lucide="rotate-ccw"></i></button>
        <button class="ib sm" id="edRotR" title="หมุนขวา"><i data-lucide="rotate-cw"></i></button>
        <button class="ib sm" id="edFlipH" title="กลับซ้ายขวา"><i data-lucide="flip-horizontal"></i></button>
        <button class="ib sm" id="edFlipV" title="กลับบนล่าง"><i data-lucide="flip-vertical"></i></button>
        <button class="ib sm" id="edReset" title="รีเซ็ต"><i data-lucide="refresh-cw"></i></button>
      </div>
    </div>
    <div class="img-editor-canvas-wrap">
      <canvas id="imgEditorCanvas"></canvas>
    </div>
    <div class="mf">
      <button class="btn ghost" id="edCancel">ยกเลิก</button>
      <button class="btn blue" id="edSave"><i data-lucide="check"></i>บันทึก</button>
    </div>
  </div>
</div>

<!-- Minimalist Rich Text Editor Modal -->
<div class="rte-mask" id="rteMask">
  <div class="rte-modal">
    <div class="mh" style="justify-content:space-between">
      <div class="row" style="gap:8px">
        <i data-lucide="type" style="width:18px;height:18px;color:var(--blue)"></i>
        <b>จัดฟอนต์คำถาม</b>
      </div>
      <button class="ib sm" id="rteClose" title="ปิด"><i data-lucide="x"></i></button>
    </div>
    <div class="rte-toolbar">
      <button type="button" class="rte-btn" data-cmd="bold" title="ตัวหนา"><i data-lucide="bold"></i></button>
      <button type="button" class="rte-btn" data-cmd="italic" title="ตัวเอียง"><i data-lucide="italic"></i></button>
      <button type="button" class="rte-btn" data-cmd="underline" title="ขีดเส้นใต้"><i data-lucide="underline"></i></button>
      <button type="button" class="rte-btn" data-cmd="strikeThrough" title="ขีดฆ่า"><i data-lucide="strikethrough"></i></button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" data-cmd="fontSize" data-val="5" title="ขยายใหญ่"><i data-lucide="zoom-in"></i></button>
      <button type="button" class="rte-btn" data-cmd="fontSize" data-val="3" title="ขนาดปกติ"><i data-lucide="type"></i></button>
      <button type="button" class="rte-btn" data-cmd="fontSize" data-val="1" title="ย่อเล็ก"><i data-lucide="zoom-out"></i></button>
      <div class="rte-sep"></div>
      <button type="button" class="rte-btn" id="btnToggleColor" title="เปลี่ยนสี"><i data-lucide="palette"></i></button>
      <button type="button" class="rte-btn" data-cmd="removeFormat" title="ล้างฟอร์แมต"><i data-lucide="rotate-ccw"></i></button>
    </div>
    
    <div class="rte-color-palette" id="rteColorPalette">
      <span style="font-size:12px;color:var(--muted);margin-right:4px">สีข้อความ:</span>
      <div class="rte-dot" data-col="#e04347" style="background:#e04347" title="แดง"></div>
      <div class="rte-dot" data-col="#2b7cf0" style="background:#2b7cf0" title="น้ำเงิน"></div>
      <div class="rte-dot" data-col="#12a150" style="background:#12a150" title="เขียว"></div>
      <div class="rte-dot" data-col="#f08c00" style="background:#f08c00" title="ส้ม"></div>
      <div class="rte-dot" data-col="#7a5af8" style="background:#7a5af8" title="ม่วง"></div>
      <div class="rte-dot" data-col="#0097a7" style="background:#0097a7" title="ฟ้าคราม"></div>
      <div class="rte-dot" data-col="#e91e63" style="background:#e91e63" title="ชมพู"></div>

const DB_NAME = 'PolicePrepDB';
const DB_VERSION = 1;
let db = null;

function initDB(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('app_state')){
        d.createObjectStore('app_state', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e);
  });
}

function dbGet(key){
  return new Promise(res => {
    if(!db) return res(null);
    const tx = db.transaction('app_state', 'readonly');
    const store = tx.objectStore('app_state');
    const req = store.get(key);
    req.onsuccess = () => res(req.result ? req.result.val : null);
    req.onerror = () => res(null);
  });
}

function dbSet(key, val){
  return new Promise(res => {
    if(!db) return res(false);
    const tx = db.transaction('app_state', 'readwrite');
    const store = tx.objectStore('app_state');
    store.put({ key, val });
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  });
}

function evaluateAdaptiveDifficulty(questionId, isCorrect){
  const q = S.questions.find(x => x.id === questionId);
  if(!q) return;

  const st = S.qstat[questionId] = S.qstat[questionId] || { seen: 0, ok: 0, bad: 0, streakOk: 0, streakBad: 0 };

  if(isCorrect){
    st.streakOk = (st.streakOk || 0) + 1;
    st.streakBad = 0;
    if(st.streakOk >= 2){
      if(q.d === 'ยาก') q.d = 'ปานกลาง';
      else if(q.d === 'ปานกลาง') q.d = 'ง่าย';
      st.streakOk = 0;
    }
  } else {
    st.streakBad = (st.streakBad || 0) + 1;
    st.streakOk = 0;
    if(st.streakBad >= 2){
      if(q.d === 'ง่าย') q.d = 'ปานกลาง';
      else if(q.d === 'ปานกลาง') q.d = 'ยาก';
      st.streakBad = 0;
    }
  }
}

function optimizeImage(file, maxWidth = 2048, quality = 0.92){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxWidth){
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function redrawEditorCanvas(){
  const canvas = $('#imgEditorCanvas');
  if(!canvas || !editorImage.width) return;
  const ctx = canvas.getContext('2d');
  
  const rad = (editorState.rotation * Math.PI) / 180;
  const isRotated = Math.abs(editorState.rotation % 180) !== 0;
  
  const w = isRotated ? editorImage.height : editorImage.width;
  const h = isRotated ? editorImage.width : editorImage.height;

  const maxW = 520, maxH = 320;
  const scale = Math.min(1, maxW / w, maxH / h);

  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rad);
  ctx.scale(editorState.flipH ? -1 : 1, editorState.flipV ? -1 : 1);
  ctx.drawImage(
    editorImage,
    -editorImage.width * scale / 2,
    -editorImage.height * scale / 2,
    editorImage.width * scale,
    editorImage.height * scale
  );
  ctx.restore();
}

function exportEditedImage(){
  if(!editorImage.width) return '';
  const isRotated = Math.abs(editorState.rotation % 180) !== 0;
  const w = isRotated ? editorImage.height : editorImage.width;
  const h = isRotated ? editorImage.width : editorImage.height;

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate((editorState.rotation * Math.PI) / 180);
  ctx.scale(editorState.flipH ? -1 : 1, editorState.flipV ? -1 : 1);
  ctx.drawImage(editorImage, -editorImage.width / 2, -editorImage.height / 2);
  ctx.restore();

  return canvas.toDataURL('image/jpeg', 0.92);
}

let AC=null;
function initAudio(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
  }catch(e){}
}

function playTone(type='tap'){
  if(!S.settings.sound) return;
  try{
    initAudio();
    if(!AC) return;
    const now = AC.currentTime;

    if(type === 'tab'){
      const osc = AC.createOscillator(), g = AC.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
      g.gain.setValueAtTime(0.3, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(g); g.connect(AC.destination);
      osc.start(now); osc.stop(now + 0.16);

    } else if(type === 'tap'){
      const osc = AC.createOscillator(), g = AC.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(280, now + 0.05);
      g.gain.setValueAtTime(0.35, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(AC.destination);
      osc.start(now); osc.stop(now + 0.07);

    } else if(type === 'pick'){
      const osc = AC.createOscillator(), g = AC.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(392.00, now + 0.08);
      g.gain.setValueAtTime(0.4, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(g); g.connect(AC.destination);
      osc.start(now); osc.stop(now + 0.13);

    } else if(type === 'flip'){
      const osc = AC.createOscillator(), g = AC.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.1);
      g.gain.setValueAtTime(0.35, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(AC.destination);
      osc.start(now); osc.stop(now + 0.15);

    } else if(type === 'ok'){
      [523.25, 659.25].forEach((freq, idx) => {
        const osc = AC.createOscillator(), g = AC.createGain();
        osc.type = 'sine';
        const start = now + idx * 0.05;
        osc.frequency.setValueAtTime(freq, start);
        g.gain.setValueAtTime(0.35, start);
        g.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
        osc.connect(g); g.connect(AC.destination);
        osc.start(start); osc.stop(start + 0.23);
      });

    } else if(type === 'wrong'){
      const osc = AC.createOscillator(), g = AC.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(349.23, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.15);
      g.gain.setValueAtTime(0.35, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(g); g.connect(AC.destination);
      osc.start(now); osc.stop(now + 0.19);
    }
  }catch(e){}
}

function avg(){ 
  const totalQuestions = S.questions.length;
  if(!totalQuestions) return 0;
  let okCount = 0;
  for(const q of S.questions){
    const st = S.qstat[q.id];
    if(st && st.ok > 0) okCount++;
  }
  return Math.round((okCount / totalQuestions) * 100);
}

function streak(){
  let n=0,d=new Date();
  if(!(S.stats.days[dkey(d)]?.answered)) d.setDate(d.getDate()-1);
  for(;;){ const k=dkey(d); if(S.stats.days[k]?.answered>0){n++;d.setDate(d.getDate()-1);} else break; if(n>400)break; }
  return n;
}

function getMonToSunWeek(){
  const now = new Date();
  const currentDayOfWeek = now.getDay();
  const diffToMonday = (currentDayOfWeek === 0 ? -6 : 1) - currentDayOfWeek;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);

  const N = ['จ','อ','พ','พฤ','ศ','ส','อา'];
  const out = [];
  const todayKey = dkey(now);

  for(let i=0; i<7; i++){
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const k = dkey(d);
    out.push({
      k,
      lb: N[i],
      n: S.stats.days[k]?.answered || 0,
      today: k === todayKey
    });
  }
  return out;
}

function getCountdownInfo(){
  if(!S.settings.examDate) return null;
  const target = new Date(S.settings.examDate + 'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffTime = target - today;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  
  if(isNaN(diffDays)) return null;

  return {
    daysLeft: diffDays,
    isPassed: diffDays < 0,
    isToday: diffDays === 0,
    examDateStr: formatThaiDate(S.settings.examDate)
  };
}

function analyzeWeakness(trackKey = 'admin'){
  const track = POLICE_TRACKS[trackKey] || POLICE_TRACKS.admin;
  const stats = {};
  S.cats.forEach(c => stats[c] = { bad:0, total:0, seen:0 });

  for(const q of S.questions){
    const st = S.qstat[q.id];
    if(st && st.seen){
      stats[q.cat].seen += st.seen;
      stats[q.cat].bad += st.bad;
    }
  }

  let worstCat = null, maxBad = 0;
  for(const [c, d] of Object.entries(stats)){
    const isFocus = track.focusCats.includes(c);
    const weightedBad = d.bad * (isFocus ? 1.5 : 1.0);
    if(weightedBad > maxBad && d.bad > 0){
      maxBad = d.bad;
      worstCat = c;
    }
  }
  return { worstCat, maxBad };
}

function evaluatePolicePassing(result, trackKey = 'admin'){
  const track = POLICE_TRACKS[trackKey] || POLICE_TRACKS.admin;
  const byCat = result.byCat;
  const overallPct = Math.round(result.correct / result.total * 100);

  if(trackKey === 'suppress'){
    const pass = overallPct >= 60;
    return {
      pass,
      trackName: track.name,
      reason: pass ? `ผ่านเกณฑ์ปราบปราม (${overallPct}%)` : `ต่ำกว่าเกณฑ์ (${overallPct}%)`,
      isComplete: true,
      p1Pct: null,
      p2Pct: null
    };
  }

  let p1T = 0, p1C = 0, p2T = 0, p2C = 0;
  for(const [c, v] of Object.entries(byCat)){
    if(track.p1 && track.p1.includes(c)){ p1T += v.t; p1C += v.c; }
    else if(track.p2 && track.p2.includes(c)){ p2T += v.t; p2C += v.c; }
  }

  const p1Pct = p1T ? Math.round(p1C / p1T * 100) : 0;
  const p2Pct = p2T ? Math.round(p2C / p2T * 100) : 0;

  if(p1T === 0 || p2T === 0){
    const pass = overallPct >= 60;
    return {
      pass,
      trackName: track.name,
      reason: pass ? `ผ่านเฉพาะหมวด (${overallPct}%)` : `ต่ำกว่าเกณฑ์ (${overallPct}%)`,
      isComplete: false,
      note: 'สายอำนวยการต้องทำทั้ง 2 ภาค (≥ 60% ทั้งคู่)',
      p1Pct, p2Pct, p1T, p1C, p2T, p2C
    };
  }

  const passP1 = p1Pct >= 60;
  const passP2 = p2Pct >= 60;
  const pass = passP1 && passP2 && (overallPct >= 60);

  let reason = '';
  if(pass) reason = `ผ่านเกณฑ์อำนวยการ (ภาค 1: ${p1Pct}%, ภาค 2: ${p2Pct}%)`;
  else if(!passP1 && !passP2) reason = `ไม่ผ่านทั้ง 2 ภาค (ภาค 1: ${p1Pct}%, ภาค 2: ${p2Pct}%)`;
  else if(!passP1) reason = `ตกภาค 1 (${p1Pct}%) ต้องได้ ≥ 60%`;
  else reason = `ตกภาค 2 (${p2Pct}%) ต้องได้ ≥ 60%`;

  return { pass, trackName: track.name, reason, isComplete: true, p1Pct, p2Pct, p1T, p1C, p2T, p2C };
}

function initCarousel(totalSlides){
  clearInterval(bannerTimer);
  if(totalSlides <= 1) return;

  const track = $('#bannerTrack');
  const dots = $$('#bannerDots .b-dot');
  bannerIdx = 0;

  function updateSlide(idx){
    bannerIdx = (idx + totalSlides) % totalSlides;
    if(track) track.style.transform = `translateX(-${bannerIdx * 100}%)`;
    dots.forEach((d, i)=>d.classList.toggle('on', i === bannerIdx));
  }

  bannerTimer = setInterval(()=>updateSlide(bannerIdx + 1), 4000);

  const slider = $('#bannerSlider');
  if(!slider) return;

  let startX = 0;
  slider.ontouchstart = e => {
    clearInterval(bannerTimer);
    startX = e.touches[0].clientX;
  };
  slider.ontouchend = e => {
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;
    if(Math.abs(diff) > 40){
      playTone('tap');
      updateSlide(diff > 0 ? bannerIdx + 1 : bannerIdx - 1);
    }
    bannerTimer = setInterval(()=>updateSlide(bannerIdx + 1), 4000);
  };
}

let QF={cat:'ทั้งหมด',term:'',sort:'new',star:false,limit:25};
let searchDebounce = null;

const SORT_LABELS = {
  new: 'ล่าสุด',
  cat: 'หมวด',
  hard: 'ยากก่อน',
  wrong: 'ผิดบ่อย'
};

function qFiltered(){
  let L = S.questions;
  if(QF.cat !== 'ทั้งหมด') L = L.filter(q => q.cat === QF.cat);
  if(QF.star) L = L.filter(q => q.star);
  if(QF.term) {
    const t = QF.term;
    L = L.filter(q => q.q.toLowerCase().includes(t) || q.c.some(x => x.toLowerCase().includes(t)));
  }

  if(QF.sort==='cat') L.sort((a,b)=>a.cat.localeCompare(b.cat,'th'));
  else if(QF.sort==='hard') L.sort((a,b)=>DIFFS.indexOf(b.d)-DIFFS.indexOf(a.d));
  else if(QF.sort==='wrong') L.sort((a,b)=>((S.qstat[b.id]?.bad)||0)-((S.qstat[a.id]?.bad)||0));
  return L;
}

        <div class="row" style="justify-content:space-between;margin-bottom:6px">

        <div id="c_img_box_${i}" style="margin-top:6px"></div>
        <div style="margin-top:8px">
          <input class="inp" id="f_cexp${i}" placeholder="เหตุผลข้อ ${LB[i]} (ทำไมถูก/ผิด)" value="${esc(curCExps[i])}" style="background:var(--surface);font-size:13px;padding:8px 12px">
        </div>
      </div>`).join('')}

    <div class="field">
      <label>หมวดหมู่ *</label>

    <div class="field">
      <label>เฉลยรวม / อธิบายภาพรวม</label>

      <div class="row" style="margin-top:8px;justify-content:space-between">
        <button type="button" class="btn sm ghost" id="btnAddEImg"><i data-lucide="image-plus"></i>แนบรูปเฉลย</button>
        <div class="row" style="gap:6px">
          <small style="color:var(--muted)">ขนาดรูปเฉลย:</small>
          <input type="range" id="f_ew" min="100" max="600" step="10" value="${curEW}" style="width:110px">
          <small id="txt_ew" style="min-width:36px;font-weight:600">${curEW}px</small>

      </div>
      <div class="img-grid" id="e_img_preview"></div>
    </div>`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="f_save"><i data-lucide="save"></i>บันทึก</button>`,
    {focus:'#f_q'});

  paintUploadPreviews();
  icons($('#modal'));

  $('#f_qw').oninput = e => { curQW = +e.target.value; $('#txt_qw').textContent = curQW + 'px'; };
  $('#f_cw').oninput = e => { curCW = +e.target.value; $('#txt_cw').textContent = curCW + 'px'; };
  $('#f_ew').oninput = e => { curEW = +e.target.value; $('#txt_ew').textContent = curEW + 'px'; };

  $$('#f_ctype .chip').forEach(b => {
    b.onclick = () => {
      playTone('tap');
      cType = b.dataset.ct;
      $$('#f_ctype .chip').forEach(x => x.classList.toggle('on', x === b));
    };
  });

  $('#btnAddQImg').onclick = () => $('#inp_qimg').click();
  $('#inp_qimg').onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    const optImg = await optimizeImage(file, 2048, 0.92);
    openImageEditor(optImg, (finalImg) => {
      curQImgs.push(finalImg);
      paintUploadPreviews();
    });
    e.target.value = '';
  };

  $('#btnAddEImg').onclick = () => $('#inp_eimg').click();
  $('#inp_eimg').onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    const optImg = await optimizeImage(file, 2048, 0.92);
    openImageEditor(optImg, (finalImg) => {
      curEImgs.push(finalImg);
      paintUploadPreviews();
    });
    e.target.value = '';
  };

  [0,1,2,3].forEach(i => {
    $(`[data-addcimg="${i}"]`).onclick = () => $(`#inp_cimg_${i}`).click();
    $(`#inp_cimg_${i}`).onchange = async e => {
      const file = e.target.files[0];
      if(!file) return;
      const optImg = await optimizeImage(file, 1600, 0.90);
      openImageEditor(optImg, (finalImg) => {
        curCImgs[i] = finalImg;
        paintUploadPreviews();
      });
      e.target.value = '';
    };
  });

  $$('#f_a .chip').forEach(b=>b.onclick=()=>{
    playTone('tap'); ans=+b.dataset.a;
    $$('#f_a .chip').forEach(x=>x.classList.toggle('on',x===b));
  });

  $$('#f_cats .chip').forEach(b=>b.onclick=()=>{
    playTone('tap'); selectedCat=b.dataset.cat;
    $$('#f_cats .chip').forEach(x=>x.classList.toggle('on',x===b));
  });

  $('#f_save').onclick=()=>{
    const qText = $('#f_q').value.trim();
    const cOpts = [0,1,2,3].map(i=>$('#f_c'+i).value.trim());
    const cExps = [0,1,2,3].map(i=>$('#f_cexp'+i).value.trim());
    const exp = $('#f_e').value.trim();

    if(!qText) return toast('ใส่คำถามก่อน','err');
    if(cOpts.some((x, i) => !x && !curCImgs[i])) return toast('ใส่ชอยส์หรือรูปให้ครบ 4 ข้อ','err');

    playTone('tap');
    closeModal();

    setTimeout(()=>{
      const o = { 
        q: qText, 
        c: cOpts, 
        cImgs: curCImgs,
        cExps: cExps,
        a: ans, 
        cat: selectedCat, 
        d: 'ง่าย',
        e: exp, 
        qImgs: curQImgs, 
        eImgs: curEImgs,
        cType,
        qImgW: curQW,
        cImgW: curCW,
        eImgW: curEW
      };
      if(q) Object.assign(q, o); 
      else S.questions.unshift({id: uid(), star: false, ...o});
      
      save();
      if(onSavedCallback) onSavedCallback();
      if(PAGE==='quiz') renderQuiz();
      syncChrome();
      toast(q ? 'แก้ไขแล้ว' : 'เพิ่มแล้ว', 'ok');
    }, 40);
  };
}

function bulkForm(){
  openModal('นำเข้าหลายข้อ',`
    <div class="field"><label>คำถาม | ก | ข | ค | ง | เฉลย(1-4) | หมวด | อธิบาย</label>
      <textarea class="inp" id="bk" style="min-height:220px;font-size:13px"
        placeholder="ข้อใดเป็นโทษทางอาญา | ปรับ | กักขัง | ริบทรัพย์สิน | ถูกทุกข้อ | 4 | กฎหมาย | อ้างอิงมาตรา 18"></textarea></div>`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="bkGo"><i data-lucide="download"></i>นำเข้า</button>`,{focus:'#bk'});

  $('#bkGo').onclick=()=>{
    playTone('tap');
    const lines=$('#bk').value.split('\n').map(x=>x.trim()).filter(Boolean);
    let n=0,skip=0;
    lines.forEach(ln=>{
      const p=ln.split('|').map(x=>x.trim());
      if(p.length<6){skip++;return;}
      const a=parseInt(p[5],10);
      if(!(a>=1&&a<=4)||!p[0]||p.slice(1,5).some(x=>!x)){skip++;return;}

      const formattedQ = p[0].replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n');
      const formattedChoices = p.slice(1,5).map(c => c.replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n'));
      const formattedExp = (p[7]||'').replace(/\\n/g, '\n').replace(/<br\s*\/?>/gi, '\n');

      let cat=p[6]||S.cats[0];
      if(!S.cats.includes(cat))S.cats.push(cat);
      S.questions.unshift({
        id: uid(),
        star: false,
        q: formattedQ,
        c: formattedChoices,
        cImgs: ['','','',''],
        cExps: ['','','',''],
        a: a-1,
        cat,
        d: 'ง่าย',
        e: formattedExp,
        qImgs: [],
        eImgs: [],
        cType: 'vertical'
      });
      n++;
    });
    save();closeModal();renderQuiz();syncChrome();
    n?toast(`นำเข้า ${n} ข้อแล้ว`,'ok'):toast('รูปแบบไม่ถูกต้อง','err');
  };
}

let CFF={cat:'ทั้งหมด',mode:'due',i:0,flip:false,list:'card'};
function cPool(){
  let L=S.cards.filter(c=>CFF.cat==='ทั้งหมด'||c.cat===CFF.cat);
  if(CFF.mode==='due')  L=L.filter(c=>(c.due||0)<=Date.now());
  if(CFF.mode==='hard') L=L.filter(c=>(c.box||0)<=1);
  return L;
}

function bulkCardForm(){
  openModal('นำเข้าบัตร', `
    <div class="field">
      <label>ด้านหน้า | ด้านหลัง | หมวด</label>
      <textarea class="inp" id="bkc" style="min-height:190px;font-size:13px"
        placeholder="พ.ร.บ.ตำรวจแห่งชาติ | พ.ศ. 2565 | กฎหมาย"></textarea>
    </div>`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="bkcGo"><i data-lucide="download"></i>นำเข้า</button>`,
    {focus:'#bkc'});

  $('#bkcGo').onclick = () => {
    playTone('tap');
    const lines = $('#bkc').value.split('\n').map(x => x.trim()).filter(Boolean);
    let n = 0, skip = 0;
    lines.forEach(ln => {
      const p = ln.split('|').map(x => x.trim());
      if(p.length < 2 || !p[0] || !p[1]){ skip++; return; }
      let cat = p[2] || S.cats[0];
      if(!S.cats.includes(cat)) S.cards.push(cat);
      S.cards.unshift({ id: uid(), f: p[0], b: p[1], cat, box: 0, due: 0 });
      n++;
    });
    save(); closeModal(); renderCards(); syncChrome();
    n ? toast(`นำเข้า ${n} ใบแล้ว`, 'ok') : toast('รูปแบบไม่ถูกต้อง', 'err');
  };
}

function renderCards(){
  const L=cPool(); CFF.i=L.length?clamp(CFF.i,0,L.length-1):0;
  const c=L[CFF.i];
  const dueN=S.cards.filter(x=>(x.due||0)<=Date.now()).length;

  $('#view').innerHTML=`
  <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <div class="chips sc" style="flex:1;min-width:0">
      ${['ทั้งหมด',...S.cats].map(x=>`<button class="chip ${CFF.cat===x?'on':''}" data-cc="${esc(x)}">${esc(x)}</button>`).join('')}
    </div>
    <button class="btn ghost sm" id="btnBulkCards"><i data-lucide="clipboard-list"></i>นำเข้าชุด</button>
    <button class="ib" id="cList" title="สลับมุมมอง"><i data-lucide="${CFF.list==='card'?'list':'square'}"></i></button>
  </div>
  <div class="chips" style="margin-bottom:14px">
    ${[['due',`ค้าง (${dueN})`],['all','ทั้งหมด'],['hard','ไม่แม่น']].map(([k,t])=>
      `<button class="chip ${CFF.mode===k?'on':''}" data-cm="${k}">${t}</button>`).join('')}
  </div>

  ${CFF.list==='list' ? listView() : cardView(L,c)}

  <div class="grid g3 keep" style="margin-top:18px;max-width:640px;margin-left:auto;margin-right:auto">
    <div class="card mini"><b>${S.cards.filter(x=>(x.box||0)===0).length}</b><span>ยังไม่เริ่ม</span></div>
    <div class="card mini"><b style="color:var(--orange)">${S.cards.filter(x=>(x.box||0)>0&&(x.box||0)<3).length}</b><span>กำลังจำ</span></div>
    <div class="card mini"><b style="color:var(--green)">${S.cards.filter(x=>(x.box||0)>=3).length}</b><span>แม่นแล้ว</span></div>
  </div>`;

  function cardView(L,c){
    if(!L.length) return `<div class="card empty" style="max-width:640px;margin:0 auto">
      <i data-lucide="layers"></i><div>ไม่มีบัตรค้าง</div></div>`;
    const box=(c.box||0);
    return `<div class="fstage">
      <div class="row" style="justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px">
        <span>${CFF.i+1} / ${L.length}</span>
        <span class="tag ${box>=3?'g':box>0?'o':''}">กล่อง ${box}/5</span></div>
      <div class="bar"><i class="${box>=3?'ok':''}" style="width:${(CFF.i+1)/L.length*100}%"></i></div>
      <div class="fcard ${CFF.flip?'flip':''}" id="fc">
        <div class="fin">
          <div class="face front">
            <span class="tag" style="background:rgba(255,255,255,.18);color:#fff">${esc(c.cat)}</span>
            <div class="q" style="white-space:pre-wrap">${esc(c.f)}</div><div class="hint">แตะเพื่อพลิก</div></div>
          <div class="face back">
            <span class="tag g">คำตอบ</span>
            <div class="q" style="white-space:pre-wrap">${esc(c.b)}</div><div class="hint">แตะเพื่อพลิกกลับ</div></div>
        </div>
      </div>
      <div class="fctrl">
        <button class="btn ghost" id="cHard"><i data-lucide="rotate-ccw"></i>ยาก</button>
        <button class="btn green" id="cKnow"><i data-lucide="check"></i>จำได้</button>
        <button class="btn" id="cNext"><i data-lucide="arrow-right"></i>ถัดไป</button>
      </div>
      <div class="row" style="justify-content:center;gap:8px;margin-top:12px">
        <button class="ib sm" id="cPrev" title="ก่อนหน้า"><i data-lucide="chevron-left"></i></button>
        <button class="ib sm" id="cShuf" title="สลับ"><i data-lucide="shuffle"></i></button>
        <button class="ib sm" id="cEdit" title="แก้ไข"><i data-lucide="pencil"></i></button>
        <button class="ib sm" id="cDrop" title="ลบ"><i data-lucide="trash-2"></i></button>
      </div>
    </div>`;
  }
  function listView(){
    const L=S.cards.filter(x=>CFF.cat==='ทั้งหมด'||x.cat===CFF.cat);
    if(!L.length)return `<div class="card empty"><i data-lucide="layers"></i><div>ไม่มีบัตร</div></div>`;
    return L.map(x=>`<div class="qrow"><div class="no">${(x.box||0)}</div>
      <div class="body"><div class="qt">${esc(x.f)}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap">${esc(x.b)}</div>
        <div class="meta"><span class="tag b">${esc(x.cat)}</span>
          <span class="tag ${(x.box||0)>=3?'g':(x.box||0)>0?'o':''}">กล่อง ${(x.box||0)}/5</span></div></div>
      <div class="side"><button class="ib sm" data-cedit="${x.id}"><i data-lucide="pencil"></i></button>
        <button class="ib sm" data-cdrop="${x.id}"><i data-lucide="trash-2"></i></button></div></div>`).join('');
  }

  $$('[data-cc]').forEach(b=>b.onclick=()=>{ playTone('tap'); CFF.cat=b.dataset.cc; CFF.i=0; CFF.flip=false; renderCards(); });
  $$('[data-cm]').forEach(b=>b.onclick=()=>{ playTone('tap'); CFF.mode=b.dataset.cm; CFF.i=0; CFF.flip=false; renderCards(); });
  $('#cList').onclick=()=>{ playTone('tap'); CFF.list=CFF.list==='card'?'list':'card'; renderCards(); };
  $('#btnBulkCards').onclick=()=>{ playTone('tap'); bulkCardForm(); };
  $$('[data-cedit]').forEach(b=>b.onclick=()=>{ playTone('tap'); cForm(S.cards.find(x=>x.id===b.dataset.cedit)); });
  $$('[data-cdrop]').forEach(b=>b.onclick=async()=>{
    if(await ask('ลบบัตรนี้?','บัตรจะถูกลบถาวร','ลบ')){
      S.cards=S.cards.filter(x=>x.id!==b.dataset.cdrop);save();renderCards();syncChrome();toast('ลบแล้ว','ok');}});

  if(c && CFF.list === 'card'){
    const fc = $('#fc');
    if(fc) {
      fc.onclick = () => {
        playTone('flip');
        CFF.flip = !CFF.flip;
        fc.classList.toggle('flip', CFF.flip);
      };
    }
    if($('#cKnow')) $('#cKnow').onclick = () => grade(c, true);
    if($('#cHard')) $('#cHard').onclick = () => grade(c, false);
    if($('#cNext')) $('#cNext').onclick = () => step(1);
    if($('#cPrev')) $('#cPrev').onclick = () => step(-1);
    if($('#cShuf')) $('#cShuf').onclick = () => {
      playTone('tap');
      CFF.i = Math.floor(Math.random() * L.length);
      CFF.flip = false;
      renderCards();
      toast('สุ่มใหม่');
    };
    if($('#cEdit')) $('#cEdit').onclick = () => cForm(c);
    if($('#cDrop')) $('#cDrop').onclick = async () => {
      if(await ask('ลบบัตรนี้?', 'บัตรจะถูกลบถาวร', 'ลบ')){
        S.cards = S.cards.filter(x => x.id !== c.id);
        save();
        renderCards();
        syncChrome();
        toast('ลบแล้ว', 'ok');
      }
    };
  }
  icons();

  function step(n){ playTone('tap'); CFF.flip=false; const len=cPool().length||1; CFF.i=(CFF.i+n+len)%len; renderCards(); }
  function grade(card,ok){
    card.box = ok ? Math.min(5,(card.box||0)+1) : 1;
    card.due = Date.now() + (ok ? SRS[card.box]*864e5 : 6e5);
    save(); playTone(ok ? 'ok' : 'wrong');
    toast(ok?`จำได้ · อีก ${SRS[card.box]} วัน`:'ทวนซ้ำ',ok?'ok':'info');
    CFF.flip=false;
    const len=cPool().length;
    if(!len){renderCards();return;}
    CFF.i=CFF.i>=len?0:CFF.i;
    renderCards();
  }
}

function cForm(card){
  const d=card||{f:'',b:'',cat:CFF.cat!=='ทั้งหมด'?CFF.cat:S.cats[0]};
  let selectedCat = d.cat;

  openModal(card?'แก้ไขบัตร':'เพิ่มบัตร',`
    <div class="field"><label>ด้านหน้า (คำถาม/คำสำคัญ) *</label><textarea class="inp" id="k_f" placeholder="คำถาม">${esc(d.f)}</textarea></div>
    <div class="field"><label>ด้านหลัง (คำตอบ/สรุป) *</label><textarea class="inp" id="k_b" placeholder="คำตอบ..." style="min-height:110px">${esc(d.b)}</textarea></div>
    <div class="field">
      <label>หมวดหมู่ *</label>
      <div class="chips" id="k_cats">
        ${S.cats.map(c=>`<button type="button" class="chip ${selectedCat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>
    </div>`,
    `<button class="btn ghost" data-close>ยกเลิก</button><button class="btn" id="k_save"><i data-lucide="save"></i>บันทึก</button>`,{focus:'#k_f'});

  $$('#k_cats .chip').forEach(b=>b.onclick=()=>{
    playTone('tap'); selectedCat=b.dataset.cat;
    $$('#k_cats .chip').forEach(x=>x.classList.toggle('on',x===b));
  });

let EX={live:false,qs:[],order:[],ans:[],flag:[],cuts:[],i:0,left:0,tid:null,mode:'exam',label:'',cfg:null,paused:false,elapsed:0};

function startExam(cfg){
  if(!cfg)return;
  let qs = [];
  const track = POLICE_TRACKS[cfg.track || S.settings.track || 'admin'];

  if(cfg.count === 150 && track && track.quota && (!cfg.cats || !cfg.cats.length)){
    Object.entries(track.quota).forEach(([catName, needCount]) => {
      let catPool = S.questions.filter(q => q.cat === catName && (!cfg.onlyStar || q.star));
      if(S.settings.shuffleQ) catPool = shuffle(catPool);
      qs.push(...catPool.slice(0, needCount));
    });
  } else {
    let rawPool = cfg.ids ? cfg.ids.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean)
                          : poolOf(cfg.cats||[],cfg.onlyStar);
    
    const grouped = {};
    rawPool.forEach(q => {
      grouped[q.cat] = grouped[q.cat] || [];
      grouped[q.cat].push(q);
    });

    for(const cat of S.cats){
      if(grouped[cat]){
        let subPool = grouped[cat];
        if(S.settings.shuffleQ) subPool = shuffle(subPool);
        qs.push(...subPool);
      }
    }

    const want = cfg.count || qs.length;
    if(want < qs.length) qs = qs.slice(0, want);
  }

  if(!qs.length)return toast('ไม่มีข้อสอบ','err');

  EX={live:true,qs,
      order:qs.map(q=>S.settings.shuffleC?shuffle([0,1,2,3]):[0,1,2,3]),
      ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),
      cuts:qs.map(()=>[]),
      i:0,left:(cfg.minutes||0)*60,tid:null,mode:cfg.mode||'exam',
      label:cfg.label||'ชุดข้อสอบ',cfg,paused:false,elapsed:0};
  S.last={...cfg}; save();
  go('run'); startClock();
}

function resumeExam(){
  const s=S.session; if(!s)return;
  const qs=s.ids.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);
  if(qs.length!==s.ids.length){S.session=null;save();return toast('ชุดเดิมไม่สมบูรณ์','err');}
  EX={live:true,qs,order:s.order,ans:s.ans,flag:s.flag,
      cuts:s.cuts || qs.map(()=>[]),
      i:s.i,left:s.left,tid:null,
      mode:s.mode,label:s.label,cfg:s.cfg,paused:false,elapsed:s.elapsed||0};
  go('run'); startClock(); toast('ทำต่อได้เลย','ok');
}

function holdExam(){ stopClock(); EX.live=false; persist(); }
function persist(){
  if(!EX.qs.length)return;
  S.session={ids:EX.qs.map(q=>q.id),order:EX.order,ans:EX.ans,flag:EX.flag,cuts:EX.cuts,i:EX.i,
             left:EX.left,mode:EX.mode,label:EX.label,cfg:EX.cfg,elapsed:EX.elapsed};
  save();
}
function startClock(){ stopClock(); EX.tid=setInterval(clock,1000); }
function stopClock(){ if(EX.tid)clearInterval(EX.tid); EX.tid=null; }
function clock(){
  if(!EX.live||EX.paused)return;
  EX.elapsed++;
  if(EX.cfg.minutes)EX.left--;
  const t=$('#tmr');
  if(t){ t.querySelector('span').textContent=EX.cfg.minutes?mmss(EX.left):mmss(EX.elapsed);
         t.classList.toggle('warn',!!EX.cfg.minutes&&EX.left<=60); }
  if(EX.elapsed%10===0)persist();
  if(EX.cfg.minutes&&EX.left<=0){toast('หมดเวลา','err');submitExam(true);}
}

      openCutModal();

function paintQ(){

  const cuts = EX.cuts[EX.i] || [];

  const qw = q.qImgW ? `${q.qImgW}px` : '260px';
  const cw = q.cImgW ? `${q.cImgW}px` : '110px';
  const ew = q.eImgW ? `${q.eImgW}px` : '240px';

  let layoutClass = 'opts-vertical';
  if (q.cType === 'horizontal') layoutClass = 'opts-horizontal';
  else if (q.cType === 'box') layoutClass = 'opts-boxed';

  $('#rbar').style.width = ((EX.i + 1) / EX.qs.length * 100) + '%';
  $('#qbox').innerHTML = `
    <div class="row" style="gap:7px;flex-wrap:wrap">
      <span class="tag b">ข้อ ${EX.i+1} / ${EX.qs.length}</span>
      <span class="tag">${esc(q.cat)}</span>
      <span class="tag ${q.d==='ยาก'?'r':q.d==='ปานกลาง'?'o':'g'}">${esc(q.d||'ง่าย')}</span>
      ${q.star?'<span class="tag o" style="background:#fff6e0;color:#f5a524"><i data-lucide="star" style="width:11px;height:11px"></i>ติดดาว</span>':''}
      ${cuts.length ? `<span class="tag r"><i data-lucide="scissors" style="width:11px;height:11px"></i>ตัด ${cuts.length} ข้อ</span>` : ''}
    </div>
    <div class="rq">${q.q}</div>
    ${(q.qImgs && q.qImgs.length) ? `
      <div class="q-media-box">
        ${q.qImgs.map((img, idx) => `<img src="${img}" class="q-media-img" style="--img-w:${qw}" onclick="openLightboxGallery(${qImgsJson}, ${idx})">`).join('')}
      </div>` : ''}
    <div id="opts" class="${layoutClass}">
      ${ord.map((oi, pos) => {
        let cls = picked === oi ? 'on' : '';
        const isCut = cuts.includes(oi);
        if(isCut) cls += ' is-cut';
        if(revealed){
          if(oi === q.a) cls = 'right';
          else if(oi === picked) cls = 'bad';
        }
        const cImg = q.cImgs && q.cImgs[oi];
        const hasChoiceExp = q.cExps && q.cExps[oi] && q.cExps[oi].trim();

        return `<div class="opt-wrap">
          <button class="opt ${cls}" data-o="${oi}" ${(revealed || isCut)?'disabled':''}>
            <div class="opt-header">
              <span class="k">${LB[pos]}</span>
              <div style="flex:1;min-width:0">
                ${q.cType === 'box' ? `<div class="opt-boxed-text">${esc(q.c[oi])}</div>` : `<span class="opt-text">${esc(q.c[oi])}</span>`}
              </div>
            </div>
            ${cImg ? `
              <div style="margin-left:43px;margin-top:6px">
                <img src="${cImg}" class="img-thumb" style="width:${cw};height:auto;max-height:180px" onclick="event.stopPropagation();openLightboxGallery(['${cImg}'], 0)">
              </div>` : ''}
          </button>

            <button type="button" class="btn-why-round" data-toggleexp="${oi}" title="ดูเหตุผล">

        <b>${picked===q.a?'✓ ถูกต้อง':'✗ เฉลย: '+LB[q.a]+'. '}</b>

        ${q.e ? `<div style="margin-top:8px;white-space:pre-wrap;line-height:1.6;border-left:3px solid currentColor;padding-left:10px;background:rgba(0,0,0,.03);border-radius:0 8px 8px 0;padding-top:4px;padding-bottom:4px">💡 ${esc(q.e)}</div>` : ''}
        ${(q.eImgs && q.eImgs.length) ? `

function paintPal(box){
  if(!box)return;
  box.innerHTML=EX.qs.map((_,i)=>
    `<button class="pal ${EX.ans[i]!==null?'done':''} ${i===EX.i?'cur':''}" data-p="${i}">${i+1}</button>`).join('');
  $$('[data-p]',box).forEach(b=>b.onclick=()=>{ playTone('tap'); jump(+b.dataset.p); closeModal(); });
}

function jump(i){ if(i<0||i>=EX.qs.length)return; EX.i=i; persist(); paintQ(); }

function pick(oi){
  if(EX.paused)return;
  const cuts = EX.cuts[EX.i] || [];
  if(cuts.includes(oi)) return;

  const q=EX.qs[EX.i];
  if(EX.mode==='practice'&&EX.ans[EX.i]!==null)return;
  EX.ans[EX.i]=oi; persist();
  if(EX.mode==='practice'){
    const ok=oi===q.a;
    playTone(ok ? 'ok' : 'wrong');
    const st=S.qstat[q.id]=S.qstat[q.id]||{seen:0,ok:0,bad:0,streakOk:0,streakBad:0};
    st.seen++; ok?st.ok++:st.bad++;
    
    evaluateAdaptiveDifficulty(q.id, ok);

    const d=day(); 
    d.answered++; 
    if(ok) d.correct++;
    d.todayCat[q.cat] = (d.todayCat[q.cat] || 0) + 1;

    save(); paintQ();
    if(ok&&EX.i<EX.qs.length-1)setTimeout(()=>jump(EX.i+1),1200);
  }else{
    playTone('pick');
    paintQ();
    if(EX.i<EX.qs.length-1)setTimeout(()=>jump(EX.i+1),200);
  }
}

async function confirmSubmit(){
  const blank=EX.ans.filter(a=>a===null).length;
  const msg=blank?`ยังไม่ตอบ ${blank} ข้อ ส่งเลยหรือไม่`:'ส่งข้อสอบ';
  if(await ask('ส่งคำตอบ?',msg,'ส่งเลย',false))submitExam(false);
}

function submitExam(timeup){
  stopClock(); EX.live=false;
  const total=EX.qs.length; let correct=0, byCat={}, wrong=[];
  const d=day();

  EX.qs.forEach((q,i)=>{
    byCat[q.cat]=byCat[q.cat]||{t:0,c:0}; byCat[q.cat].t++;
    const a=EX.ans[i];
    if(EX.mode!=='practice'){
      const st=S.qstat[q.id]=S.qstat[q.id]||{seen:0,ok:0,bad:0,streakOk:0,streakBad:0};
      if(a!==null){
        st.seen++; 
        const isCorrect = (a===q.a);
        isCorrect?st.ok++:st.bad++;
        evaluateAdaptiveDifficulty(q.id, isCorrect);
        d.todayCat[q.cat] = (d.todayCat[q.cat] || 0) + 1;
      }
    }
    if(a===q.a){correct++;byCat[q.cat].c++;}
    else wrong.push({id:q.id,picked:a});
  });

  const blank=EX.ans.filter(a=>a===null).length;
  if(EX.mode!=='practice'){ d.answered+=total-blank; d.correct+=correct; }
  
  const trackKey = (EX.cfg && EX.cfg.track) || S.settings.track || 'admin';
  const evalResult = evaluatePolicePassing({correct, total, byCat}, trackKey);

  S.results.unshift({
    id:uid(),date:new Date().toISOString(),label:EX.label,mode:EX.mode,
    total,correct,wrong:total-correct-blank,blank,used:EX.elapsed,byCat,wrongList:wrong,
    cfg:EX.cfg,timeup:!!timeup,trackKey,evalResult
  });
  S.results=S.results.slice(0,60);
  S.session=null; save();
  
  checkDailyGoalAchievement();

  go('result'); toast('ส่งแล้ว','ok');
}

function checkDailyGoalAchievement(){
  const t = day();
  const goal = S.settings.goal;
  if(t.answered >= goal && t.answered - (EX.qs.length || 0) < goal){
    setTimeout(()=>{
      openGoalAchievedModal(goal);
    }, 450);
  }
}

document.addEventListener('keydown',e=>{
  if(PAGE!=='run'||!EX.live||$('#mask').classList.contains('on')||$('#imgEditorMask').classList.contains('on')||$('#rteMask').classList.contains('on'))return;
  if(['1','2','3','4'].includes(e.key)){
    const pos=+e.key-1, ord=EX.order[EX.i]; if(ord&&ord[pos]!==undefined)pick(ord[pos]);
  }
  if(e.key==='ArrowRight'){ playTone('tap'); jump(EX.i+1); }
  if(e.key==='ArrowLeft'){ playTone('tap'); jump(EX.i-1); }
  if(e.key.toLowerCase()==='e'){
    playTone('tap');
    const q = EX.qs[EX.i];
    qForm(q, () => { paintQ(); toast('อัปเดตแล้ว', 'ok'); });
  }
  if(e.key.toLowerCase()==='c'){
    playTone('tap');
    openCutModal();
  }
});

function openRoundDetail(resultId, selectedCat = null){
  const res = S.results.find(x => x.id === resultId);
  if(!res) return;

  const pct = Math.round(res.correct / res.total * 100);
  const ev = res.evalResult || evaluatePolicePassing(res, res.trackKey || 'admin');

  if(selectedCat){
    const wrongInCat = res.wrongList
      .map(w => ({ w, q: S.questions.find(x => x.id === w.id) }))
      .filter(item => item.q && item.q.cat === selectedCat);

    const catStat = res.byCat[selectedCat] || { c: 0, t: 0 };
    const catPct = catStat.t ? Math.round(catStat.c / catStat.t * 100) : 0;
    const isCatPass = catPct >= 60;

    const wrongListHtml = wrongInCat.length ? wrongInCat.map(({ w, q }, idx) => {
      const qImgsJson = JSON.stringify(q.qImgs || []).replace(/"/g, '&quot;');
      const eImgsJson = JSON.stringify(q.eImgs || []).replace(/"/g, '&quot;');
      const correctImg = q.cImgs && q.cImgs[q.a];
      const pickedImg = w.picked !== null && q.cImgs && q.cImgs[w.picked];
      const isBox = q.cType === 'box';
      const qw = q.qImgW ? `${q.qImgW}px` : '260px';
      const cw = q.cImgW ? `${q.cImgW}px` : '110px';
      const ew = q.eImgW ? `${q.eImgW}px` : '240px';

      const choiceExpPicked = (w.picked !== null && q.cExps && q.cExps[w.picked]) ? q.cExps[w.picked] : '';
      const choiceExpCorrect = (q.cExps && q.cExps[q.a]) ? q.cExps[q.a] : '';

      <div style="background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px">

        ${(q.qImgs && q.qImgs.length) ? `
          <div class="q-media-box">
            ${q.qImgs.map((img, i) => `<img src="${img}" class="q-media-img" style="--img-w:${qw}" onclick="openLightboxGallery(${qImgsJson}, ${i})">`).join('')}

          </div>` : ''}
        <div style="font-size:13px;color:var(--green);font-weight:600">
          ✓ เฉลย: ${LB[q.a]}.

                <span class="tag ${isPass ? 'g' : 'r'}" style="font-weight:700">${p}% ${isPass ? 'ผ่าน' : 'ตก'}</span>

            </div>

      </div>
